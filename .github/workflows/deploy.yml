name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy website
        run: |
          scp -i ~/.ssh/id_ed25519 index.html style.css ec2-user@${{ secrets.EC2_HOST }}:/tmp/
          ssh -i ~/.ssh/id_ed25519 ec2-user@${{ secrets.EC2_HOST }} \
            'sudo cp /tmp/index.html /tmp/style.css /var/www/html/ && sudo systemctl restart httpd'
